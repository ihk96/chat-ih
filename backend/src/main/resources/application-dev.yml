# spring
spring:
    datasource:
        url: jdbc:h2:mem:chat;MODE=PostgreSQL
        driver-class-name: org.h2.Driver
        username: sa
        password:

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        database: H2
        show-sql: false
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        com.inhyuk: debug
        org.springframework: info
        org.hibernate: warn
        org.hibernate.SQL: error

security:
    jwt:
        # base64 encoded 64+ bytes secret (default also provided in code)
        secret: ZGV2LXNlY3JldC1rZXktZGV2LXNlY3JldC1rZXktZGV2LXNlY3JldC1rZXktZGV2LXNlY3JldC1rZXktZGV2LXNlY3JldC1rZXk=
        expiration-millis: 86400000
