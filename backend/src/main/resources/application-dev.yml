# spring
spring:
    datasource:
        url: jdbc:h2:mem:chat;MODE=PostgreSQL
        driver-class-name: org.h2.Driver
        username: sa
        password:

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        database: H2
        show-sql: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        com.inhyuk: debug
        org.springframework: info
        org.hibernate: warn
        org.hibernate.SQL: error
