# spring
spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat}
        driver-class-name: org.postgresql.Driver
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        hikari:
            maximum-pool-size: ${DB_POOL_SIZE:100}
            minimum-idle: ${DB_POOL_MIN_IDLE:5}

    h2:
        console:
            enabled: false
            path: /h2-console

    jpa:
        database: postgresql
        show-sql: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
    level:
        com.inhyuk: info
        org.springframework: info
        org.hibernate: warn
        org.hibernate.SQL: error
